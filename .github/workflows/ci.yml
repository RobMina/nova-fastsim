name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest-minimal:
    name: pytest (no optional extras)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]  # novafastsim-ldm needs >=3.11 (bdnmc-nova)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install packages
        run: |
          python -m pip install -U pip
          pip install -e 'core[test]' -e calib -e ldm -e beamline
      - name: Pytest
        run: python -m pytest -q

  pytest-ldmgen:
    name: pytest (+ ldmgen and fibre extras)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install packages with ldmgen and fibre
        run: |
          python -m pip install -U pip
          pip install -e 'core[test]' -e 'calib[fibre]' -e 'ldm[ldmgen]' -e beamline
      - name: Pytest
        run: python -m pytest -q

  no-site-paths:
    name: no site-specific strings in public tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grep gate
        run: |
          set -euo pipefail
          # Generic patterns only: absolute site roots, home directories, private wiki
          # checkouts and placeholders. Never list real hosts, accounts or paths here.
          if git grep -nE '(^|[^$A-Za-z_{])/(project|scratch|exp|pnfs|nashome|home|Users)/[A-Za-z0-9_.-]+/|ai-config|private-[a-z-]*wiki' \
              -- ':!.github/workflows/ci.yml' 2>/dev/null; then
            echo "::error::site-specific string found in public tree (see rule: env vars only)"
            exit 1
          fi
          echo "ok: no banned site strings"
