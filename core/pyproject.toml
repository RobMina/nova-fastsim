[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novafastsim"
version = "0.0.1"
description = "NOvA ND JAX fast-simulation core: experiment profile, dtype and site helpers"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
jax = ["jax"]
hepsim = ["hep-simlib @ git+https://github.com/RobMina/hep-simlib.git"]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["novafastsim*"]
