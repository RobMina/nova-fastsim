[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novafastsim-calib"
version = "0.0.1"
description = "NOvA ND calibration libraries for nova-fastsim (hep-simlib banks under the nova profile)"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["novafastsim"]

[tool.setuptools.packages.find]
include = ["novafastsim_calib*"]

[project.optional-dependencies]
# same pin as detsim
fibre = ["scint-fibre-fastsim @ git+https://github.com/RobMina/scint-fibre-fastsim.git@8dc73d04f4a97f47605d654f42f4eae019325d53"]
