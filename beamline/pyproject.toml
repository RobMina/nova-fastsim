[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novafastsim-beamline"
version = "0.0.1"
description = "Beamline / flux hooks for nova-fastsim (g4numi / future GPU flux)"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["novafastsim"]

[tool.setuptools.packages.find]
include = ["novafastsim_beamline*"]
