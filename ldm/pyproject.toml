[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novafastsim-ldm"
version = "0.0.1"
description = "Thin LDM orchestration for nova-fastsim over BdNMC / ldmgen / bdnmc-nova"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["novafastsim"]

[tool.setuptools.packages.find]
include = ["novafastsim_ldm*"]
